# Blueprint de Render para staging del backend CEPA.
# Despliegue: en Render → New → Blueprint → conectar este repo. Render lee este archivo
# y crea el web service Docker.
#
# Tras el primer deploy, define en el dashboard del servicio (Environment) las variables
# marcadas `sync: false` (no se versionan): DATABASE_URL con la cadena de conexión de la
# Postgres externa, y SEED_ADMIN_USERNAME / SEED_ADMIN_PASSWORD para crear el usuario
# inicial de Coordinación. JWT_SECRET se genera automáticamente.
#
# La BD **no** la gestiona este blueprint: la Postgres free de Render expira a los ~30 días
# y al vencer se lleva el servicio entero por delante (el entrypoint corre `alembic upgrade
# head` con `set -e`, así que sin BD el contenedor muere antes de escuchar el puerto y las
# peticiones quedan colgadas). Usamos una Postgres externa sin expiración (Neon/Supabase).
# El plan `free` del web service sí se mantiene: solo se duerme, y el primer request tras
# inactividad tarda ~50s en despertarlo. Subir a `starter` para algo más estable.

services:
  - type: web
    name: cepa-backend-staging
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Cadena de conexión de la Postgres externa (definir en el dashboard; no versionar:
      # trae la contraseña). Se acepta `postgres://`, `postgresql://` o con driver explícito;
      # `app/config.py` normaliza a psycopg v3 y conserva los parámetros (p. ej. sslmode=require).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Usuario inicial de Coordinación (definir en el dashboard; no versionar).
      - key: SEED_ADMIN_USERNAME
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NOMBRE
        value: Coordinación
